[package]
name = "kilo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A text editor rewritten from kilo, taught as a Rust course"
license = "MIT"
repository = "https://github.com/mancuoj-collective/kilo-rs"
keywords = ["editor", "tui", "terminal", "text-editor"]
categories = ["command-line-utilities", "text-editors"]

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
unicode-width = "0.2"

# Project-wide rules for "modern Rust": no unsafe, and clippy's all + pedantic
# as the baseline. See Apollo's Rust Best Practices, chapter 2.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = 10 }
pedantic = { level = "warn", priority = 3 }
