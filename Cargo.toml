[package]
name = "kilo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"

# 这就是本项目对「现代 Rust 写法」的强制约定：
# unsafe 一律禁止，clippy 的 all + pedantic 作为底线。
# 参考 Apollo《Rust Best Practices》第 2 章。
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = 10 }
pedantic = { level = "warn", priority = 3 }
